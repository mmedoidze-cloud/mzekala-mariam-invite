<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>მზექალასა და მარიამის დაბადების დღე</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #120205;
      color: #fdfaf6;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* კონვერტის სექცია */
    .envelope-section {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #120205;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .envelope-section.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .envelope-wrapper {
      position: relative;
      width: 340px;
      height: 230px;
      background-color: #4a0d17;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      cursor: pointer;
      transition: transform 0.4s ease;
    }

    .envelope-wrapper:hover {
      transform: scale(1.02);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 170px solid transparent;
      border-right: 170px solid transparent;
      border-top: 130px solid #6b1120;
      transform-origin: top;
      transition: transform 0.6s ease;
      z-index: 4;
    }

    .pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 170px solid #540e1a;
      border-right: 170px solid #540e1a;
      border-bottom: 120px solid #3b0710;
      border-top: 120px solid transparent;
      border-radius: 0 0 12px 12px;
      z-index: 3;
    }

    .seal {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #d4af37, #fff2a8, #aa771c);
      border-radius: 50%;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    .seal span { font-size: 22px; }
    .click-hint {
      position: absolute;
      bottom: -30px;
      color: #d4af37;
      font-size: 12px;
      letter-spacing: 1.5px;
      white-space: nowrap;
      font-weight: 600;
    }

    /* მთავარი კონტენტი (თავიდან დამალული) */
    .main-content {
      opacity: 0;
      visibility: hidden;
      transform: translateY(30px);
      transition: all 1s ease 0.5s;
      max-width: 450px;
      width: 90%;
      padding: 40px 20px;
      text-align: center;
      background: rgba(30, 5, 10, 0.85);
      border: 2px solid #d4af37;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9);
      margin: 20px;
    }

    .main-content.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .invite-subtitle {
      color: #d4af37;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .names {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      color: #fff;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .event-type {
      font-size: 16px;
      color: #d4af37;
      margin-bottom: 25px;
    }

    .divider {
      color: #d4af37;
      font-size: 14px;
      margin: 20px 0;
    }

    .details-box {
      background: rgba(74, 13, 23, 0.4);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .details-box p {
      font-size: 16px;
      margin: 10px 0;
      color: #f3e9dc;
    }

    .details-box strong {
      color: #d4af37;
    }

    /* ღილაკები */
    .rsvp-container {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 25px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: transform 0.2s, background 0.3s;
    }

    .btn-yes {
      background: #2e7d32;
      color: white;
    }

    .btn-no {
      background: #c62828;
      color: white;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .response-message {
      margin-top: 20px;
      font-size: 15px;
      font-weight: 600;
      color: #d4af37;
      min-height: 25px;
    }
  </style>
</head>
<body>

  <!-- კონვერტის სექცია -->
  <div class="envelope-section" id="envelopeSection" onclick="openInvitation()">
    <div class="envelope-wrapper">
      <div class="flap" id="envelopeFlap"></div>
      <div class="pocket"></div>
      <div class="seal">
        <span>✨</span>
        <div class="click-hint">დააჭირეთ გასახსნელად</div>
      </div>
    </div>
  </div>

  <!-- მთავარი მოსაწვევი ბარათი -->
  <div class="main-content" id="mainContent">
    <p class="invite-subtitle">გეპატიჟებით გრანდიოზულ წვეულებაზე</p>
    <h1 class="names">მზექალა & მარიამი</h1>
    <p class="event-type">ჩვენი დაბადების დღე</p>

    <div class="divider">✦ ✦ ✦</div>

    <div class="details-box">
      <p>📅 <strong>თარიღი:</strong> 21 ოქტომბერი</p>
      <p>⏰ <strong>დრო:</strong> 19:00 საათი</p>
      <p>📍 <strong>ადგილი:</strong> რესტორანი "ვილა პარკი"</p>
    </div>

    <p style="font-size: 14px; margin-bottom: 15px; color: #ccc;">გთხოვთ, დაადასტუროთ დასწრება:</p>

    <div class="rsvp-container">
      <button class="btn btn-yes" onclick="sendRSVP('მოვდივარ ✅')">მოვდივარ</button>
      <button class="btn btn-no" onclick="sendRSVP('ვერ მოვდივარ ❌')">ვერ მოვდივარ</button>
    </div>

    <div class="response-message" id="responseMsg"></div>
  </div>

  <script>
    function openInvitation() {
      const flap = document.getElementById('envelopeFlap');
      const section = document.getElementById('envelopeSection');
      const content = document.getElementById('mainContent');

      // კონვერტის თავსახურის გახსნის ანიმაცია
      flap.style.transform = 'rotateX(180deg)';
      flap.style.zIndex = '1';

      setTimeout(() => {
        section.classList.add('hidden');
        content.classList.add('visible');
      }, 500);
    }

    function sendRSVP(status) {
      const msg = document.getElementById('responseMsg');
      if (status.includes('მოვდივარ')) {
        msg.style.color = '#4caf50';
        msg.innerText = 'მადლობა! ძალიან გელოდებით! 🎉';
      } else {
        msg.style.color = '#ef5350';
        msg.innerText = 'გვწყინს, რომ ვერ მოახერხებთ 💔';
      }

      // აქ შეგიძლიათ ჩასვათ თქვენი WhatsApp ნომერი (მაგ: 995599123456)
      // const phone = "995599XXXXXX";
      // window.open(`https://wa.me/${phone}?text=${encodeURIComponent('მზექალას და მარიამის დაბადების დღე: ' + status)}`, '_blank');
    }
  </script>

</body>
</html>
